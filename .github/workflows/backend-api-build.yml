name: Backend API Build

on:
  push:
    paths:
      - "src/Backend/**"
      - ".github/workflows/backend-api-build.yml"
  pull_request:
    paths:
      - "src/Backend/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore src/Backend/Api.csproj

      - name: Build
        run: dotnet build src/Backend/Api.csproj --configuration Release --no-restore
